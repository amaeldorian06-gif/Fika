    <!-- JSON-LD LocalBusiness injecté dynamiquement via lib/seo (source unique : lib/site.ts) -->
    <title>Fika | Nous nous occupons du reste</title>
    <script>
      // Confort d'accès : une URL saisie « en dur » (/admin, /services…) est
      // convertie vers la route hash équivalente (#/admin) avant le rendu.
      (function () {
        var p = window.location.pathname.replace(/\/index\.html$/, '');
        if (p && p !== '/' && !window.location.hash) {
          window.location.replace(window.location.origin + '/#' + p);
        }
      })();
    </script>
